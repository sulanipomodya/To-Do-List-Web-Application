<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Task Manager</span>
        </div>
    </nav>

    <div class="container col-md-8 col-lg-6">
        <h2 class="text-center mb-4">My To-Do List</h2>

        <!-- Task Input Card -->
        <div class="card p-3 mb-3 shadow-sm">
            <div class="input-group">
                <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task...">
                <button id="addTaskBtn" class="btn btn-primary">Add Task</button>
            </div>
            <!-- Task 6: Error Message Container -->
            <div id="errorMessage" class="text-danger small mt-2 d-none">
                Task description cannot be empty!
            </div>
        </div>

        <!-- Filter & Action Controls (Task 7 & 8) -->
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-outline-primary filter-btn active" data-filter="all">All</button>
                <button type="button" class="btn btn-outline-primary filter-btn" data-filter="active">Active</button>
                <button type="button" class="btn btn-outline-primary filter-btn" data-filter="completed">Completed</button>
            </div>
            <button id="clearCompletedBtn" class="btn btn-outline-danger btn-sm">Clear Completed</button>
        </div>

        <!-- Task Counter (Task 8) -->
        <div class="mb-3 text-muted">
            <span id="taskCounter">0</span> active task(s) remaining
        </div>

        <!-- Task List Container -->
        <ul id="taskList" class="list-group"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
